name: Enso
description: >-
  Enso is onchain infrastructure that turns DeFi product intent into signer-ready
  transaction data. Its Route API finds the optimal path between any two tokens or
  positions across 250+ protocols and multiple chains, while the Bundle API composes
  ordered onchain Actions (deposit, swap, borrow, bridge, flashloan, transfer and
  more) into a single executable transaction. Enso also exposes protocol, token,
  price and balance data, a Quoter for a simulate-then-validate transaction-safety
  model, cross-chain routing over Stargate/LayerZero, Chainlink CCIP, Relay and
  Circle CCTP, and prebuilt React widgets (Checkout, cross-chain route). Developers
  authenticate with a Bearer API key and integrate via the @ensofinance/sdk
  TypeScript SDK. Backed by Multicoin Capital and Techstars; 100+ apps and 1,900+
  developers build on Enso.
