          type: string
          description: Token to split
          example: 0xC02a...
        tokenOut:
          description: Output token addresses
          example:
          - 0x...
          - 0x...
          type: array
          items:
            type: string
        amountIn:
          description: Amount to split (or previous output reference)
          oneOf:
          - type: string
            description: Literal string value (e.g. wei amount)
          - $ref: '#/components/schemas/CallOutput'
            description: Reference output from a previous action
          example: '1000000000000000000'
        receiver:
          type: string
          description: Receiver address
          example: 0x...
      required:
      - tokenIn
      - tokenOut
      - amountIn
    CctpBridgeProtocolArgsDto:
      type: object
      properties:
        transferType:
          type: string
          description: CCTP only. Preferred finality threshold. "fast" requires Circle-designated fast-source support; falls back to "standard" silently when unavailable.
          enum:
          - fast
          - standard
          example: fast
        forwardFee:
          type: string
          description: 'CCTP only. Forwarding Service fee bracket (destination-chain gas buffer). Applies to all CCTP transfers — Forwarding is always used to guarantee destination execution. Defaults to `high`: headroom against fee drift between quote and forward execution (an under-budgeted maxFee strands the transfer until Circle re-attempts). Pass `med`/`low` to trade delivery headroom for a better quote.'
          enum:
          - low
          - med
          - high
          default: high
          example: high
        isHyperCoreTransfer:
          type: boolean
          description: 'CCTP HyperCore only. When true, the CCTP burn delivers USDC into HyperCore via Circle''s CctpForwarder instead of minting at `receiver` on HyperEVM. Requires `destinationChainId = 999` (HyperEVM) and a source chain other than HyperEVM. Most consumers should NOT set this directly — use the `callback: [enso:balance, hypercore-spot:deposit]` shape, or rely on `/route/nontokenized` with `positionOut = 0x2000…0000` to set it automatically.'
          example: true
    CallOutput:
      type: object
      properties:
        useOutputOfCallAt:
          type: number
        index:
          type: number
      required:
      - useOutputOfCallAt
    WithdrawArgsDto:
