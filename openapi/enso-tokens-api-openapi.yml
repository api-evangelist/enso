openapi: 3.2.0
info:
  title: Enso Tokens API
  description: '#### Enso API

    - Find detailed documentation on docs.enso.finance.

    - To use the API, **you must include your API Key in the Authorization header** (Bearer format).

    - For testing, Swagger pre-authorizes you using the key: `1e02632d-6feb-4a75-a157-documentation` (1rps).

    - Get your own API Key at enso.finance/developers.'
  version: 1.0.1
  contact: {}
servers:
- url: https://api.enso.build
security:
- {}
tags:
- name: Tokens
paths:
  /api/v1/nontokenized:
    get:
      operationId: NonTokenizedController_tokens
      description: Returns a list of all nontokenized positions with details.
      summary: Nontokenized positions
      parameters:
      - name: project
        required: false
        in: query
        description: The overarching project or platform associated with the DeFi token, for example `aave`
        schema:
          example: beradrome
          type: string
      - name: protocolSlug
        required: false
        in: query
        description: The specific standard integration or version of the DeFi project, for example `aave-v2`
        schema:
          example: beradrome-farms
          type: string
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network of the nontokenized position
        schema:
          example: 80094
          type: number
      - name: address
        required: false
        in: query
        description: Ethereum addresses of the nontokenized positions
        schema:
          type: array
          items:
            type: string
      - name: primaryAddress
        required: false
        in: query
        description: Ethereum addresses for contract interaction of nontokenized position
        schema:
          type: array
          items:
            type: string
      - name: page
        required: false
        in: query
        description: Pagination page number. Pages are of length 1000
        schema:
          type: number
      - name: cursor
        required: false
        in: query
        description: Cursor for pagination. Pages are of length 1000
        schema:
          type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResult'
                - properties:
                    data:
                      type: array
                      description: Returned data for current page
                      items:
                        $ref: '#/components/schemas/NonTokenizedModel'
      tags:
      - Tokens
  /api/v1/prices/{chainId}/{address}:
    get:
      operationId: PricesController_getPrice
      description: Returns token price for the given address and chainId.
      summary: Token Price
      parameters:
      - name: address
        required: true
        in: path
        description: Address of the token to search for
        schema:
          example: '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2'
      - name: chainId
        required: true
        in: path
        description: Chain ID of the network to search for
        schema:
          example: '1'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Price'
      tags:
      - Tokens
  /api/v1/tokens:
    get:
      operationId: TokensController_tokens
      description: Returns tokens and their details. This APi includes cursor-based pagination with default 1000 items per page.
      summary: Tokens
      parameters:
      - name: includeMetadata
        required: false
        in: query
        description: Whether to include token metadata (symbol, name and logos)
        schema:
          default: false
          example: false
          type: boolean
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network of the token
        schema:
          example: 1
          type: number
      - name: project
        required: false
        in: query
        description: The overarching project or platform associated with the DeFi token, for example `aave`
        schema:
          example: aave
          type: string
      - name: protocolSlug
        required: false
        in: query
        description: The specific standard integration or version of the DeFi project, for example `aave-v2`
        schema:
          example: aave-v2
          type: string
      - name: address
        required: false
        in: query
        description: Ethereum addresses of the tokens
        schema:
          example:
          - '0x030bA81f1c18d280636F32af80b9AAd02Cf0854e'
          type: array
          items:
            type: string
      - name: underlyingTokens
        required: false
        in: query
        description: Underlying tokens of defi token
        schema:
          example:
          - '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
          type: array
          items:
            type: string
      - name: underlyingTokensExact
        required: false
        in: query
        description: Exact composition of underlying tokens of defi token
        schema:
          example:
          - '0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2'
          type: array
          items:
            type: string
      - name: primaryAddress
        required: false
        in: query
        description: Ethereum addresses for contract interaction of defi tokens
        schema:
          example:
          - '0x7d2768dE32b0b80b7a3454c06BdAc94A69DDc7A9'
          type: array
          items:
            type: string
      - name: apyFrom
        required: false
        in: query
        description: Only include tokens with APY over this value
        schema:
          example: 1
          type: number
      - name: apyTo
        required: false
        in: query
        description: Only include tokens with APY below this value
        schema:
          example: 10
          type: number
      - name: tvlFrom
        required: false
        in: query
        description: Only include tokens with TVL over this value
        schema:
          example: 0
          type: number
      - name: tvlTo
        required: false
        in: query
        description: Only include tokens with TVL below this value
        schema:
          example: 10000000
          type: number
      - name: type
        required: false
        in: query
        description: "Type of token.\n If not provided, both types will be taken into account"
        schema:
          example: defi
          enum:
          - defi
          - base
          type: string
      - name: page
        required: false
        in: query
        description: Pagination page number. Pages are of length 1000
        schema:
          example: '1'
          type: number
      - name: cursor
        required: false
        in: query
        description: Cursor for pagination. Pages are of length 1000
        schema:
          example: '1233456'
          type: number
      - name: name
        required: false
        in: query
        description: Names of the tokens
        schema:
          example:
          - Bridged USDT
          type: array
          items:
            type: string
      - name: symbol
        required: false
        in: query
        description: Symbols of the tokens
        schema:
          example:
          - USDC
          type: array
          items:
            type: string
      - name: pageSize
        required: false
        in: query
        description: Number of items per page (max 1000)
        schema:
          default: 1000
          example: 100
          type: number
      - name: includeUnderlying
        required: false
        in: query
        description: Whether to include underlying tokes
        schema:
          default: true
          example: false
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResult'
                - properties:
                    data:
                      type: array
                      description: Returned data for current page
                      items:
                        $ref: '#/components/schemas/PositionModel'
      tags:
      - Tokens
  /api/v1/prices/{chainId}:
    get:
      operationId: PricesController_getPrices
      summary: Tokens Prices Batched
      parameters:
      - name: chainId
        required: true
        in: path
        description: Chain ID of the network to search for
        schema:
          example: '1'
          type: number
      - name: addresses
        required: true
        in: query
        description: Ethereum address of the token to check price for.
        schema:
          example:
          - '0xc02aaa39b223fe8d0a0e5c4f27ead9083c756cc2'
          type: array
          items:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Price'
      tags:
      - Tokens
      description: Returns prices for a batch of tokens on a given chain.
components:
  schemas:
    PaginationMeta:
      type: object
      properties:
        total:
          type: number
          description: Total amount of pages
        lastPage:
          type: number
          description: Last page number
        currentPage:
          type: number
          description: Current page number
        perPage:
          type: number
          description: Amount of elements per page
        prev:
          type: number
          description: Previous page
        next:
          type: number
          description: Next page
        cursor:
          type: number
          description: Cursor for pagination
      required:
      - total
      - lastPage
      - currentPage
      - perPage
      - prev
      - next
      - cursor
    TokenModel:
      type: object
      properties:
        address:
          type: string
          description: Ethereum address of the token
        chainId:
          type: number
          description: Chain ID of the network of the token
        type:
          type: string
          description: Type of token
        decimals:
          type: number
          description: Token decimals
        symbol:
          type:
          - string
          - 'null'
          description: Token name
        name:
          type:
          - string
          - 'null'
          description: Token symbol
        logosUri:
          description: A list of logos for the token
          type:
          - array
          - 'null'
          items:
            type: string
      required:
      - address
      - chainId
      - type
      - decimals
      - symbol
      - name
      - logosUri
    NonTokenizedModel:
      type: object
      properties:
        chainId:
          type: number
          description: Chain ID of the network of the nontokenized position
        protocol:
          type: string
          description: The specific standard integration or version of the nontokenized position
        address:
          type: string
          description: Ethereum address of the nontokenized position
        primaryAddress:
          type: string
          description: Ethereum address of the nontokenized position
        underlyingTokens:
          description: Underlying tokens of nontokenized position
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TokenModel'
      required:
      - chainId
      - protocol
      - address
      - primaryAddress
      - underlyingTokens
    PaginatedResult:
      type: object
      properties:
        meta:
          description: Metadata for pagination
          allOf:
          - $ref: '#/components/schemas/PaginationMeta'
      required:
      - meta
    Price:
      type: object
      properties:
        decimals:
          type: number
          example: 8
        price:
          type: number
          example: 27052
        address:
          type: string
          example: '0x2260fac5e5542a773aa44fbcfedf7c193bc2c599'
        symbol:
          type: string
          example: WBTC
        timestamp:
          type: number
          example: 1695197412
        chainId:
          type: number
          example: 1
        confidence:
          type: number
          example: 0.99
      required:
      - decimals
      - price
      - address
      - chainId
    PositionModel:
      type: object
      properties:
        address:
          type: string
          description: Ethereum address of the token
        chainId:
          type: number
          description: Chain ID of the network of the token
        type:
          type: string
          description: Type of token
        decimals:
          type: number
          description: Token decimals
        symbol:
          type:
          - string
          - 'null'
          description: Token name
        name:
          type:
          - string
          - 'null'
          description: Token symbol
        logosUri:
          description: A list of logos for the token
          type:
          - array
          - 'null'
          items:
            type: string
        underlyingTokens:
          description: Underlying tokens of defi token
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/TokenModel'
        project:
          type:
          - string
          - 'null'
          description: The overarching project or platform associated with the DeFi token, for example `aave`
          example: aave
        protocolSlug:
          type:
          - string
          - 'null'
          description: The specific standard integration or version of the DeFi project, for example `aave-v2`
        apy:
          type:
          - number
          - 'null'
          description: The defi position APY
          example: 3.8
        apyBase:
          type:
          - number
          - 'null'
          description: The defi position base APY
          example: 2.6
        apyReward:
          type:
          - number
          - 'null'
          description: The defi position reward APY
          example: 1.2
        borrowApyBase:
          type:
          - number
          - 'null'
          description: The defi position base borrow APY
          example: 2.6
        borrowApyReward:
          type:
          - number
          - 'null'
          description: The defi position reward borrow APY
          example: 1.2
        tvl:
          type:
          - number
          - 'null'
          description: The defi position TVL
          example: 3001020.8
        primaryAddress:
          type:
          - string
          - 'null'
          description: Ethereum address for contract interaction of defi token
      required:
      - address
      - chainId
      - type
      - decimals
      - symbol
      - name
      - logosUri
      - underlyingTokens
      - project
      - protocolSlug
      - apy
      - apyBase
      - apyReward
      - borrowApyBase
      - borrowApyReward
      - tvl
      - primaryAddress
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: apiKey
      type: http
x-provenance:
  method: harvested
  publisher: Enso
  source: https://docs.enso.build/public/openapi.json
