openapi: 3.2.0
info:
  title: Enso DeFi Shortcuts API
  description: '#### Enso API

    - Find detailed documentation on docs.enso.finance.

    - To use the API, **you must include your API Key in the Authorization header** (Bearer format).

    - For testing, Swagger pre-authorizes you using the key: `1e02632d-6feb-4a75-a157-documentation` (1rps).

    - Get your own API Key at enso.finance/developers.'
  version: 1.0.1
  contact: {}
servers:
- url: https://api.enso.build
security:
- {}
tags:
- name: DeFi Shortcuts
paths:
  /api/v1/shortcuts/quote:
    get:
      operationId: QuoteController_quote
      summary: Quote from a token to another
      description: Returns the expected output amount and selected route for a token swap without executable transaction calldata.
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the quote on
        schema:
          default: 1
          type: number
      - name: fromAddress
        required: false
        in: query
        description: Ethereum address of the wallet to quote from
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: tokenIn
        required: true
        in: query
        description: Ethereum address of the token to swap from. For ETH, use 0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        schema:
          example:
          - '0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'
          type: array
          items:
            type: string
            enum:
            - 0x
            - 1inch
            - openocean
            - kyberswap
            - native
            - paraswap
            - bebop
            - barter
            - sushiswap-router
            - ooga-booga
            - renegade
            - uniswap
            - rooster
            - wowmax
            - grapher
            - hyperbloom
            - hyperswap
            - hyperflow
            - fly
            - eisen
            - nordstern
            - everlong
            - bitget
      - name: tokenOut
        required: true
        in: query
        description: Ethereum address of the token to swap to. For ETH, use 0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        schema:
          example:
          - '0x6b175474e89094c44da98b954eedeac495271d0f'
          type: array
          items:
            type: string
            enum:
            - 0x
            - 1inch
            - openocean
            - kyberswap
            - native
            - paraswap
            - bebop
            - barter
            - sushiswap-router
            - ooga-booga
            - renegade
            - uniswap
            - rooster
            - wowmax
            - grapher
            - hyperbloom
            - hyperswap
            - hyperflow
            - fly
            - eisen
            - nordstern
            - everlong
            - bitget
      - name: amountIn
        required: true
        in: query
        description: Amount of tokenIn to swap in wei
        schema:
          example:
          - '1000000000000000000'
          type: array
          items:
            type: string
            enum:
            - cctp
            - stargate
            - ccip
            - relay
      - name: routingStrategy
        required: false
        in: query
        description: Routing strategy to use
        schema:
          enum:
          - ensowallet-v2
          - router
          - delegate
          - router-legacy
          - delegate-legacy
          type:
          - string
          - 'null'
      - name: ignoreAggregators
        required: false
        in: query
        description: A list of swap aggregators to be ignored from consideration
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - 0x
            - 1inch
            - openocean
            - kyberswap
            - native
            - paraswap
            - bebop
            - barter
            - sushiswap-router
            - ooga-booga
            - renegade
            - uniswap
            - rooster
            - wowmax
            - grapher
            - hyperbloom
            - hyperswap
            - hyperflow
            - fly
            - eisen
            - nordstern
            - everlong
            - bitget
      - name: ignoreStandards
        required: false
        in: query
        description: A list of standards to be ignored from consideration
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteEndpointResponse'
        '400':
          description: ''
      tags:
      - DeFi Shortcuts
  /api/v1/shortcuts/route:
    post:
      operationId: RouterController_postRouteShortcutTransaction
      description: Calculates optimal transaction with the best route between two tokens, which may involve several actions that interact with various DeFi protocols. This single call already quotes internally and returns executable calldata along with `amountOut` and `gas`, so there is no separate quote step to call beforehand. To enter a non-tokenized position, use the GET `/shortcuts/route/nontokenized`.
      summary: Optimal route between two tokens
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RouteShortcutVariableInputs'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteShortcutTransaction'
        '400':
          description: ''
      tags:
      - DeFi Shortcuts
    get:
      operationId: RouterController_routeShortcutTransaction
      description: Calculates optimal transaction with the best route between two tokens, which may involve several actions that interact with various DeFi protocols. This single call already quotes internally and returns executable calldata along with `amountOut` and `gas`, so there is no separate quote step to call beforehand. To enter a non-tokenized position, use GET `shortcuts/route/nontokenized`.
      summary: Optimal route between two tokens
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the transaction on
        schema:
          default: 1
          type: number
      - name: fromAddress
        required: true
        in: query
        description: Ethereum address of the wallet to send the transaction from
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: amountIn
        required: true
        in: query
        description: Amount of tokenIn to swap in wei
        schema:
          example:
          - '1000000000000000000'
          type: array
          items:
            type: string
      - name: tokenIn
        required: true
        in: query
        description: Ethereum address of the token to swap from. For ETH, use 0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        schema:
          example:
          - '0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'
          type: array
          items:
            type: string
      - name: tokenOut
        required: true
        in: query
        description: Ethereum address of the token to swap to. For ETH, use 0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        schema:
          example:
          - '0x6b175474e89094c44da98b954eedeac495271d0f'
          type: array
          items:
            type: string
      - name: routingStrategy
        required: false
        in: query
        description: Routing strategy to use. in majority of cases you can use `router`. Use `delegate` with EOA when you want to specify a `spender`
        schema:
          enum:
          - ensowallet
          - router
          - delegate
          - router-legacy
          - delegate-legacy
          type:
          - string
          - 'null'
      - name: toEoa
        required: false
        in: query
        description: Flag that indicates if gained tokenOut should be sent to EOA
        deprecated: true
        schema:
          type:
          - boolean
          - 'null'
      - name: receiver
        required: false
        in: query
        description: Ethereum address of the receiver of the tokenOut
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: spender
        required: false
        in: query
        description: Ethereum address of the spender of the tokenIn
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: minAmountOut
        required: false
        in: query
        description: Minimum amount out in wei. If specified, slippage should not be specified
        schema:
          default: null
          type: array
          items:
            type: string
      - name: slippage
        required: false
        in: query
        description: Slippage in basis points (1/10000), e.g. 50 = 0.50%. Takes precedence over minAmountOut.
        schema:
          default: '500'
          example: '300'
          type: string
      - name: ignoreAggregators
        required: false
        in: query
        description: A list of swap aggregators to be ignored from consideration
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - 0x
            - 1inch
            - openocean
            - kyberswap
            - native
            - paraswap
            - bebop
            - barter
            - sushiswap-router
            - ooga-booga
            - renegade
            - uniswap
            - rooster
            - wowmax
            - grapher
            - hyperbloom
            - hyperswap
            - hyperflow
            - fly
            - eisen
            - nordstern
            - everlong
            - bitget
      - name: ignoreStandards
        required: false
        in: query
        description: A list of standards to be ignored from consideration
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
      - name: ignoreBridges
        required: false
        in: query
        description: 'A list of bridges to be ignored from consideration for crosschain routes. Supported values: `relay`, `stargate`, `ccip`, `cctp`'
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - cctp
            - stargate
            - ccip
            - relay
      - name: referralCode
        required: false
        in: query
        description: Referral code that will be included in an on-chain event.
        schema:
          maxLength: 16
          example: 0123456789ABCDEF
          type: string
      - name: destinationChainId
        required: false
        in: query
        description: Chain ID of the network to bridge to and receive tokenOut
        schema:
          type: number
      - name: crosschainRouteMode
        required: false
        in: query
        description: Controls cross-chain route complexity. direct uses only a bridge, source allows routing before the bridge, destination allows routing after the bridge, sourceOrDestination allows routing on either chain but not both, and full allows routing on both chains
        schema:
          default: full
          enum:
          - direct
          - source
          - destination
          - sourceOrDestination
          - full
          type: string
      - name: refundReceiver
        required: false
        in: query
        description: Ethereum address of the receiver of any dust tokens that might be produced during the execution of actions
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteShortcutTransaction'
        '400':
          description: ''
      tags:
      - DeFi Shortcuts
  /api/v1/shortcuts/route/nontokenized:
    get:
      operationId: NontokenizedController_routeNontokenizedShorcutTransaction
      description: Calculates optimal transaction with the best route entering a non-tokenized position, which may involve several actions that interact with various DeFi protocols.
      summary: Routing to a non-tokenized position
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the transaction on
        schema:
          default: 1
          example: 80094
          type: number
      - name: fromAddress
        required: true
        in: query
        description: Ethereum address of the wallet to send the transaction from
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: routingStrategy
        required: false
        in: query
        description: Routing strategy to use. For this API, always use `delegate` in conjunction with a Smart Wallet.
        schema:
          enum:
          - delegate
          - delegate-legacy
          type:
          - string
          - 'null'
      - name: tokenIn
        required: true
        in: query
        description: Ethereum address of the token to swap from. For ETH, use 0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        schema:
          example:
          - '0xeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee'
          type: array
          items:
            type: string
      - name: positionOut
        required: true
        in: query
        description: Ethereum address of the position to receive
        schema:
          example: '0xf99be47baf0c22b7eb5eac42c8d91b9942dc7e84'
          type: string
      - name: slippage
        required: false
        in: query
        description: Slippage in basis points (1/10000), e.g. 50 = 0.50%. Takes precedence over minAmountOut.
        schema:
          default: '50'
          example: '300'
          type: string
      - name: amountIn
        required: true
        in: query
        description: Amount of tokenIn to swap in wei
        schema:
          example:
          - '1000000000000000000'
          type: array
          items:
            type: string
      - name: receiver
        required: true
        in: query
        description: Ethereum address of the receiver of the positionOut
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: spender
        required: false
        in: query
        description: Ethereum address of the spender of the tokenIn
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: referralCode
        required: false
        in: query
        description: Referral code that will be included in an on-chain event.
        schema:
          maxLength: 16
          example: 0123456789ABCDEF
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RouteShortcutTransaction'
        '400':
          description: ''
      tags:
      - DeFi Shortcuts
  /api/v1/shortcuts/bundle:
    post:
      operationId: BundleController_bundleShortcutTransaction
      description: Returns a single transaction bundling the submitted actions. For available actions, see `/actions` endpoint.
      summary: Bundle a list of actions
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the transaction on
        schema:
          default: 1
          type: number
      - name: fromAddress
        required: true
        in: query
        description: Ethereum address of the wallet to send the transaction from
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: routingStrategy
        required: false
        in: query
        description: "Routing strategy to use. Use `delegate` when:\n- You want to specify `spender` \n- You want to use the `harvest` or `deposit` action with `/bundle` endpoint"
        schema:
          enum:
          - ensowallet
          - router
          - delegate
          - router-legacy
          - delegate-legacy
          type:
          - string
          - 'null'
      - name: receiver
        required: false
        in: query
        description: Ethereum address of the receiver of the tokenOut
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: spender
        required: false
        in: query
        description: Ethereum address of the spender of the tokenIn
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: ignoreAggregators
        required: false
        in: query
        description: A list of swap aggregators to be ignored from consideration. See `/aggregators` endpoint for available aggregators
        schema:
          type:
          - array
          - 'null'
          items:
            type: string
            enum:
            - 0x
            - 1inch
            - openocean
            - kyberswap
            - native
            - paraswap
            - bebop
            - barter
            - sushiswap-router
            - ooga-booga
            - renegade
            - uniswap
            - rooster
            - wowmax
            - grapher
            - hyperbloom
            - hyperswap
            - hyperflow
            - fly
            - eisen
            - nordstern
            - everlong
            - bitget
      - name: referralCode
        required: false
        in: query
        description: Referral code that will be included in an on-chain event after encoding to hex. At most 16 characters.
        schema:
          maxLength: 16
          example: 0123456789ABCDEF
          type: string
      - name: refundReceiver
        required: false
        in: query
        description: Ethereum address of the receiver of any dust tokens that might be produced during the execution of actions
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: skipQuote
        required: false
        in: query
        description: Flag to skip quoting (if true, amountOut and gas will not be returned)
        schema:
          type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                $ref: '#/components/schemas/ActionToBundle'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleShortcutTransaction'
      tags:
      - DeFi Shortcuts
  /api/v1/shortcuts/static/ipor:
    post:
      operationId: IporController_iporShortcutTransaction
      summary: Get transaction for IPOR shortcut
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the transaction on
        schema:
          default: 1
          type: number
      - name: fromAddress
        required: true
        in: query
        description: Ethereum address of the wallet to send the transaction from
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IporShortcutInput'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IporShortcutTransaction'
      tags:
      - DeFi Shortcuts
  /api/v1/wallet:
    get:
      operationId: WalletController_wallet
      summary: Returns EnsoWallet-v2 address details
      description: Deterministic (CREATE2) EnsoWallet-v2 address for `fromAddress` on `chainId`, and whether it is deployed. The wallet is deployed by the factory inside the first transaction routed through it, so the address can be used as an approval target beforehand.
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the transaction on
        schema:
          default: 1
          type: number
      - name: fromAddress
        required: true
        in: query
        description: Ethereum address of the wallet to send the transaction from
        schema:
          default: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: routingStrategy
        required: false
        in: query
        description: Routing strategy to use
        schema:
          enum:
          - ensowallet-v2
          - router
          - delegate
          - router-legacy
          - delegate-legacy
          type:
          - string
          - 'null'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
      tags:
      - DeFi Shortcuts
  /api/v1/wallet/approve:
    get:
      operationId: WalletController_createApproveTransaction
      description: Returns a transaction that approves your Enso contracts to spend the given amount of specified tokens. Approve before sending the route transaction on-chain.
      summary: Approve Enso contract
      parameters:
      - name: chainId
        required: false
        in: query
        description: Chain ID of the network to execute the transaction on
        schema:
          default: 1
          type: number
      - name: fromAddress
        required: true
        in: query
        description: Ethereum address of the wallet to send the transaction from
        schema:
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
          type: string
      - name: routingStrategy
        required: false
        in: query
        description: Routing strategy to use. Use the same routing strategy you used to create the transaction.
        schema:
          enum:
          - ensowallet
          - router
          - delegate
          - router-legacy
          - delegate-legacy
          type:
          - string
          - 'null'
      - name: tokenAddress
        required: true
        in: query
        description: ERC20 token address of the token to approve
        schema:
          default: '0x6b175474e89094c44da98b954eedeac495271d0f'
          type: string
      - name: amount
        required: true
        in: query
        description: Amount of tokens to approve in wei
        schema:
          default: '1000000000000000000000000000'
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletApproveTransaction'
      tags:
      - DeFi Shortcuts
components:
  schemas:
    TokenizedSingleDepositArgs:
      type: object
      description: Arguments for the tokenized single deposit action
      title: TokenizedSingleDeposit
      properties:
        tokenIn:
          type: string
          description: Address of token to deposit
        tokenOut:
          type: string
          description: Address of token to receive
        amountIn:
          type: string
          description: The amount to send
        primaryAddress:
          type: string
          description: Address of smart contract to interact with
        receiver:
          type:
          - string
          - 'null'
          description: The receiver account
      required:
      - tokenIn
      - tokenOut
      - amountIn
      - primaryAddress
    WalletApproveTransaction:
      type: object
      properties:
        tx:
          type: object
          description: The tx object to use in `ethers`
        gas:
          type: string
          description: The gas estimate for the transaction
        token:
          type: string
          description: The token address to approve
        amount:
          type: string
          description: The amount of tokens to approve
        spender:
          type: string
          description: The spender address to approve
      required:
      - tx
      - gas
      - token
      - amount
      - spender
    ApproveArgs:
      type: object
      description: Arguments for the approve action
      title: Approve
      properties:
        token:
          type: string
          description: The token address
        spender:
          type: string
          description: The spender address
        amount:
          type: string
          description: The amount to approve
      required:
      - token
      - spender
      - amount
    Wallet:
      type: object
      properties:
        address:
          type: string
        isDeployed:
          type: boolean
      required:
      - address
      - isDeployed
    Transaction:
      type: object
      properties:
        data:
          type: string
        to:
          type: string
        from:
          type: string
        value:
          type: string
      required:
      - data
      - to
      - from
      - value
    BridgeArgs:
      type: object
      description: Arguments for the bridge action
      title: Bridge
      properties:
        primaryAddress:
          type: string
          description: Address of the source bridge pool
          example: '0x38EA452219524Bb87e18dE1C24D3bB59510BD783'
        destinationChainId:
          type: number
          description: Chain ID of the destination network
          example: 42161
        tokenIn:
          type: string
          description: Address of token to bridge from source chain
          example: '0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48'
        amountIn:
          oneOf:
          - type: string
            description: Amount to bridge with full decimals
            example: '1000000000'
          - $ref: '#/components/schemas/OutputReference'
        receiver:
          type: string
          description: Address to receive bridged tokens on destination chain
          example: '0xd8da6bf26964af9d7eed9e03e53415d37aa96045'
        callback:
          type: array
          description: Array of actions to execute on the destination chain after bridging. CCTP currently supports only the [enso:balance, hypercore-spot:deposit] callback shape for USDC to HyperCore; other CCTP callbacks are rejected.
          items:
            type: object
            description: Any valid action that can be executed on the destination chain
        protocolArgs:
          type: object
          description: Protocol-specific bridge args. For CCTP, use transferType, forwardFee, and isHyperCoreTransfer.
          properties:
            transferType:
              type: string
              enum:
              - fast
              - standard
              description: CCTP only. Preferred finality threshold. Fast falls back to standard when unavailable.
              example: fast
            forwardFee:
              type: string
              enum:
              - low
              - med
              - high
              description: CCTP only. Forwarding Service fee bracket (destination-chain gas buffer). Applies to all CCTP transfers. Forwarding is always used to guarantee destination execution. Defaults to `med`. Pass `high` for more headroom against fee drift between quote and forward execution, or `low` to trade delivery headroom for a better quote. An under-budgeted maxFee can strand the transfer until Circle re-attempts.
              default: med
              example: med
            isHyperCoreTransfer:
              type: boolean
              description: CCTP HyperCore only. Prefer the [enso:balance, hypercore-spot:deposit] callback shape unless building protocol-level integrations.
              example: true
      required:
      - primaryAddress
      - destinationChainId
      - tokenIn
      - amountIn
      - receiver
    ActionToBundle:
      type: object
      properties:
